<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNO Kyvorix</title>
<style>body{font-family:sans-serif;background:#ffcc80;text-align:center;padding:10px} .card{display:inline-block;width:70px;height:100px;border-radius:12px;line-height:100px;font-size:32px;font-weight:bold;margin:5px;cursor:pointer;color:#fff}</style></head>
<body><h1>🃏 UNO Kyvorix</h1><p>Clica numa carta da mesma cor ou número que a do meio!</p><h2>Carta no meio: <span id="mid">?</span></h2><div id="hand"></div><div id="msg"></div>
<script>let mid={n:5,c:'red'};let hand=[{n:5,c:'blue'},{n:2,c:'red'},{n:7,c:'green'},{n:5,c:'yellow'},{n:9,c:'red'}];function render(){document.getElementById('mid').innerText=mid.n+' - '+mid.c;let h=document.getElementById('hand');h.innerHTML='';hand.forEach(function(card,i){let d=document.createElement('div');d.className='card';d.style.background=card.c;d.innerText=card.n;d.onclick=function(){if(card.n==mid.n||card.c==mid.c){mid=card;hand.splice(i,1);document.getElementById('msg').innerText='✅ Boa jogada!';if(hand.length==0)document.getElementById('msg').innerHTML='🏆 GANHASTE! UNO! <button onclick="location.reload()">Outra vez</button>';render();}else{document.getElementById('msg').innerText='❌ Não podes jogar essa!';}};h.appendChild(d);});}render();</script></body></html>
