<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jewel - Kyvorix</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0a3d2a;color:#fff;font-family:system-ui;text-align:center}header{padding:8px}header a{color:#fff;text-decoration:none;font-weight:800}.row{display:flex;gap:4px;justify-content:center;padding:6px;flex-wrap:nowrap}.pile{width:calc((100vw - 40px)/7);max-width:82px;position:relative;min-height:95px;border:2px dashed rgba(255,255,255,.4);border-radius:8px;background:rgba(0,0,0,.15);flex-shrink:0}.pile.sel{outline:3px solid #ffb800}.card{width:100%;max-width:64px;height:88px;background:#fff;color:#111;border-radius:8px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:20px;font-weight:800;cursor:pointer}.card.red{color:#d00}.card.back{background:linear-gradient(135deg,#0b6cff,#7b2ff7);color:#fff;font-size:12px}.stack .card{position:absolute;left:3px;top:0}.stack{min-height:220px}.pile .card{position:absolute;left:3px;top:0}button{background:#ffb800;border:0;padding:10px 16px;border-radius:999px;font-weight:800;cursor:pointer;margin:4px}#msg{font-weight:700;min-height:20px}.savebar{background:rgba(0,0,0,.3);padding:8px;font-size:13px}#timer{font-weight:800;background:rgba(0,0,0,.3);display:inline-block;padding:4px 12px;border-radius:999px;margin:4px}</style></head><body>
<header><a href="/">? VOLTAR</a><h1>?? Jewel</h1></header><span id="timer" style="font-weight:800;background:rgba(0,0,0,.3);padding:4px 12px;border-radius:999px;margin:4px">?? 00:00</span><div style="background:rgba(0,0,0,.3);padding:8px;font-size:13px">?? Pontos gravados | <button onclick="localStorage.removeItem('kyv_save_jewel');location.reload()">?? Novo Jogo</button></div>
<div>Pontos: <span id="pts">0</span> | Meta: 500 ?? | Jogadas: <span id="moves">30</span> | XP: <span id="xp">0</span></div><div id="msg" style="font-weight:800;min-height:20px"></div><div class="grid" id="grid"></div>
<script>
const KEY='kyv_save_jewel';
function beep(f){try{let a=new (window.AudioContext||window.webkitAudioContext)();let o=a.createOscillator();o.frequency.value=f||600;o.connect(a.destination);o.start();o.stop(a.currentTime+0.08)}catch(e){}}
function addXP(n){let x=parseInt(localStorage.getItem('kyv_xp')||'0')+n;localStorage.setItem('kyv_xp',x);document.getElementById('xp').textContent=x}
document.getElementById('xp').textContent=localStorage.getItem('kyv_xp')||'0';
let gems=['??','??','??','??','??','??'];let board,sel=null,pts=0,busy=false,moves=30,over=false;
function initFresh(){board=[];for(let i=0;i<64;i++)board.push(gems[Math.floor(Math.random()*6)]);pts=0;moves=30;over=false;}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&s.board){board=s.board;pts=s.pts;moves=(s.moves??30);over=false;return true}}catch(e){}return false}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({board,pts,moves}))}catch(e){}}
if(!load())initFresh();
function render(){persist();let g=document.getElementById('grid');g.innerHTML='';board.forEach((v,i)=>{let d=document.createElement('div');d.className='cell'+(sel==i?' sel':'');d.textContent=v;d.onclick=()=>click(i);g.appendChild(d)});document.getElementById('pts').textContent=pts;let mv=document.getElementById('moves');if(mv)mv.textContent=moves;let mg=document.getElementById('msg');if(mg){if(pts>=500)mg.textContent='?? GANHASTE! 500 pontos!';else if(over)mg.textContent='?? Fim de jogo - sem jogadas. Carrega em Novo Jogo!';else mg.textContent='';}}
function click(i){if(busy||over)return;if(sel===null){sel=i;render();return}let r1=Math.floor(sel/8),c1=sel%8,r2=Math.floor(i/8),c2=i%8;if(Math.abs(r1-r2)+Math.abs(c1-c2)!=1){sel=i;render();return}let oldSel=sel;let t=board[oldSel];board[oldSel]=board[i];board[i]=t;sel=null;moves--;if(!findMatches().size){let t2=board[i];board[i]=board[oldSel];board[oldSel]=t2;render();return}busy=true;doCascade();render()}
function findMatches(){let s=new Set();for(let r=0;r<8;r++)for(let c=0;c<6;c++){let i=r*8+c;if(board[i]&&board[i]==board[i+1]&&board[i]==board[i+2]){s.add(i);s.add(i+1);s.add(i+2)}}for(let c=0;c<8;c++)for(let r=0;r<6;r++){let i=r*8+c;if(board[i]&&board[i]==board[i+8]&&board[i]==board[i+16]){s.add(i);s.add(i+8);s.add(i+16)}}return s}
function doCascade(){let m=findMatches();if(!m.size){busy=false;if(pts>=500){over=true;addXP(50);beep(900);}else if(moves<=0){over=true;}render();return}pts+=m.size*10;addXP(m.size);beep(700);m.forEach(i=>board[i]=null);render();setTimeout(()=>{for(let c=0;c<8;c++){let col=[];for(let r=7;r>=0;r--){let v=board[r*8+c];if(v)col.push(v)}while(col.length<8)col.push(gems[Math.floor(Math.random()*6)]);for(let r=7;r>=0;r--)board[r*8+c]=col[7-r]}doCascade();render()},350)}
render();
</script></body></html>
