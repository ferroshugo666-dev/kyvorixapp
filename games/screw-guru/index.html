<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screw Guru</title>
<style>body{font-family:sans-serif;background:#e1d5ff;text-align:center;padding:10px} .screw{display:inline-block;background:#fff;border-radius:12px;width:70px;height:70px;line-height:70px;font-size:32px;margin:5px;cursor:pointer}</style></head>
<body><h1>🔩 Screw Guru</h1><p>Clica nos parafusos pela cor certa!</p><h2>Pontos: <span id="p">0</span></h2><div id="box"></div><p id="msg">Clica em todos os 🔩 vermelhos</p>
<script>let p=0;let colors=['🔴','🔵','🟢','🔴','🔵','🔴'];let box=document.getElementById('box');colors.forEach(function(c){let d=document.createElement('div');d.className='screw';d.innerText=c+'🔩';d.onclick=function(){if(c=='🔴'){p+=10;d.style.visibility='hidden';}else{p-=5;}document.getElementById('p').innerText=p;if(p>=30)document.getElementById('msg').innerText='🏆 És um Guru!';};box.appendChild(d);});</script></body></html>
