<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo</title>
<style>body{font-family:sans-serif;background:#ffdfdf;text-align:center;padding:10px}.num{display:inline-block;background:#fff;border-radius:50%;width:55px;height:55px;line-height:55px;margin:5px;font-weight:bold;cursor:pointer}.sel{background:#ff4081;color:#fff}button{padding:12px 20px;border:0;border-radius:10px;background:#e91e63;color:#fff;font-weight:bold}</style></head>
<body><h1>🎱 Bingo</h1><h2>⭐ Nível <span id="lvl">1</span>/5</h2><h3>Número: <span id="n">?</span> | Acertos: <span id="hit">0</span>/<span id="goal">3</span></h3><button onclick="sortear()">Sortear</button><div id="grid" style="max-width:350px;margin:15px auto"></div><div id="msg"></div><br><button onclick="next()">⏭️ Próximo Nível</button>
<script>let lvl=1,hit=0,goals=[3,4,5,6,7];function render(){document.getElementById('lvl').innerText=lvl;document.getElementById('goal').innerText=goals[lvl-1];document.getElementById('hit').innerText=hit;let g=document.getElementById('grid');g.innerHTML='';for(let i=1;i<=15;i++){let d=document.createElement('div');d.className='num';d.innerText=i;d.id='n'+i;g.appendChild(d);}}function sortear(){let r=Math.floor(Math.random()*15)+1;document.getElementById('n').innerText=r;let el=document.getElementById('n'+r);if(el&&!el.classList.contains('sel')){el.classList.add('sel');hit++;document.getElementById('hit').innerText=hit;if(hit>=goals[lvl-1])document.getElementById('msg').innerText='🏆 BINGO! Nível completo!';}}function next(){if(hit>=goals[lvl-1]){if(lvl<5){lvl++;hit=0;render();document.getElementById('msg').innerText='➡️ Nível '+lvl;}else{document.getElementById('msg').innerText='👑 Rei do Bingo!';}}else{document.getElementById('msg').innerText='❌ Falta acertar!';}}render();</script></body></html>
