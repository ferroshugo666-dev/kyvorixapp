<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNO</title>
<style>body{font-family:sans-serif;background:#ffcc80;text-align:center;padding:10px}.card{display:inline-block;width:70px;height:100px;border-radius:12px;line-height:100px;font-size:32px;font-weight:bold;margin:5px;cursor:pointer;color:#fff}</style></head>
<body><h1>🃏 UNO Kyvorix</h1><h2>⭐ Nível <span id="lvl">1</span>/5</h2><p>Carta no meio: <span id="mid">?</span></p><div id="hand"></div><div id="msg"></div><br><button onclick="next()">⏭️ Próximo Nível</button>
<script>let lvl=1,mid={n:5,c:'red'},hand=[];function newHand(){hand=[];let colors=['red','blue','green','yellow'];for(let i=0;i<4+lvl;i++){hand.push({n:Math.floor(Math.random()*9)+1,c:colors[Math.floor(Math.random()*4)]});}hand.push({n:5,c:'red'});}function render(){document.getElementById('lvl').innerText=lvl;document.getElementById('mid').innerText=mid.n+' - '+mid.c;let h=document.getElementById('hand');h.innerHTML='';hand.forEach(function(card,i){let d=document.createElement('div');d.className='card';d.style.background=card.c;d.innerText=card.n;d.onclick=function(){if(card.n==mid.n||card.c==mid.c){mid=card;hand.splice(i,1);document.getElementById('msg').innerText='✅ Boa!';if(hand.length==0)document.getElementById('msg').innerText='🏆 Nível completo! Clica Próximo Nível';render();}else{document.getElementById('msg').innerText='❌ Não podes!';}};h.appendChild(d);});}function next(){if(hand.length==0){if(lvl<5){lvl++;mid={n:5,c:'red'};newHand();render();document.getElementById('msg').innerText='➡️ Nível '+lvl;}else{document.getElementById('msg').innerText='👑 Campeão UNO!';}}else{document.getElementById('msg').innerText='❌ Acaba as cartas primeiro!';}}newHand();render();</script></body></html>
