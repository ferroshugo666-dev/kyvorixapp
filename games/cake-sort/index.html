<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cake Sort</title>
<style>body{font-family:sans-serif;background:#ffe0f0;text-align:center;padding:10px}.cake{display:inline-block;font-size:45px;margin:5px;cursor:pointer;background:#fff;border-radius:12px;padding:10px}button{padding:12px 20px;border:0;border-radius:10px;background:#ff4081;color:#fff;font-weight:bold}</style></head>
<body><h1>🍰 Cake Sort</h1><h2>⭐ Nível <span id="lvl">1</span>/5 | Pontos: <span id="p">0</span> | Meta: <span id="goal">30</span></h2><div id="box"></div><div id="msg"></div><br><button onclick="next()">⏭️ Próximo Nível</button>
<script>let lvl=1,p=0,goals=[30,50,70,90,120],last='';function render(){document.getElementById('lvl').innerText=lvl;document.getElementById('goal').innerText=goals[lvl-1];let box=document.getElementById('box');box.innerHTML='';let cakes=[];for(let i=0;i<3+lvl;i++){cakes.push('🍰','🧁','🍩');}cakes.sort(()=>Math.random()-0.5);cakes.forEach(function(c){let d=document.createElement('div');d.className='cake';d.innerText=c;d.onclick=function(){if(last==c){p+=10;d.style.visibility='hidden';document.getElementById('p').innerText=p;document.getElementById('msg').innerText='✅ Par! +10';if(p>=goals[lvl-1])document.getElementById('msg').innerText='🏆 Nível completo!';}else{last=c;document.getElementById('msg').innerText='Clica noutro '+c;}};box.appendChild(d);});}function next(){if(p>=goals[lvl-1]){if(lvl<5){lvl++;p=0;document.getElementById('p').innerText=0;render();}else{document.getElementById('msg').innerText='👑 Mestre dos Bolos!';}}else{document.getElementById('msg').innerText='❌ Falta '+(goals[lvl-1]-p)+' pontos';}}render();</script></body></html>
