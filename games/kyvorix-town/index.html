<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kyvorix Town</title>
<style>body{font-family:sans-serif;background:#b8e986;text-align:center;padding:10px}.top{background:#fff;padding:10px;border-radius:12px;display:flex;justify-content:space-around;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:400px;margin:15px auto}.card{background:#fff;border-radius:14px;padding:15px;cursor:pointer;font-size:28px}#log{background:#fff;border-radius:10px;padding:10px;max-width:400px;margin:10px auto}</style></head>
<body><h1>🏡 Kyvorix Town</h1><h2>⭐ Nível <span id="lvl">1</span>/5</h2><p id="goal">Objetivo: 1 casa + 1 animal</p>
<div class="top"><span>🪙 <b id="coins">100</b></span><span>🏠 <b id="houses">0</b></span><span>🐄 <b id="animals">0</b></span></div>
<div class="grid"><div class="card" onclick="act('garden')">🌻<br><small>Jardim +10</small></div><div class="card" onclick="act('house')">🏠<br><small>Casa -50</small></div><div class="card" onclick="act('car')">🚗<br><small>Carro +15</small></div><div class="card" onclick="act('lake')">🏖️<br><small>Lago +20</small></div><div class="card" onclick="act('find')">🔍<br><small>Encontrar Animal</small></div><div class="card" onclick="act('feed')">🥕<br><small>Alimentar +10</small></div></div>
<div id="log">Bem-vindo!</div><br><button onclick="nextLevel()">⏭️ Próximo Nível</button>
<script>let lvl=1,c=100,h=0,a=0;let goals=[{h:1,a:1},{h:2,a:2},{h:2,a:3},{h:3,a:4},{h:4,a:5}];let list=['🐄','🐔','🐷','🐑','🐶'];
function up(){document.getElementById('lvl').innerText=lvl;document.getElementById('coins').innerText=c;document.getElementById('houses').innerText=h;document.getElementById('animals').innerText=a;document.getElementById('goal').innerText='Objetivo: '+goals[lvl-1].h+' casas + '+goals[lvl-1].a+' animais';}
function lg(t){document.getElementById('log').innerHTML=t+'<br>'+document.getElementById('log').innerHTML;}
function check(){let g=goals[lvl-1];if(h>=g.h&&a>=g.a){lg('🏆 NÍVEL '+lvl+' COMPLETO! Clica Próximo Nível');}}
function nextLevel(){let g=goals[lvl-1];if(h>=g.h&&a>=g.a){if(lvl<5){lvl++;h=0;a=0;c=100;lg('➡️ Nível '+lvl+'!');up();}else{lg('👑 JOGO COMPLETO! És o Rei da Cidade!');}}else{lg('❌ Ainda falta cumprir o objetivo!');}}
function act(t){if(t=='garden'){c+=10;lg('🌻 +10')}if(t=='house'){if(c>=50){c-=50;h++;lg('🏠 Casa!')}else lg('❌ Precisas 50')}if(t=='car'){c+=15;lg('🚗 +15')}if(t=='lake'){c+=20;lg('🎣 +20')}if(t=='find'){if(a<5){lg('🎉 Encontraste '+list[a]);a++;}else lg('✅ Já tens todos')}if(t=='feed'){if(a>0){c+=10;lg('🥕 +10')}else lg('🔍 Encontra 1 animal')}up();check();}up();</script></body></html>
