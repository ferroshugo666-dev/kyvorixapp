<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo</title>
<style>body{font-family:sans-serif;background:#ffdfdf;text-align:center;padding:10px} .num{display:inline-block;background:#fff;border-radius:50%;width:55px;height:55px;line-height:55px;margin:5px;font-weight:bold;cursor:pointer} .sel{background:#ff4081;color:#fff} button{padding:12px 20px;border:0;border-radius:10px;background:#e91e63;color:#fff;font-weight:bold}</style></head>
<body><h1>🎱 Bingo Kyvorix</h1><h2>Número: <span id="n">?</span></h2><button onclick="sortear()">Sortear Número</button><div id="grid" style="max-width:350px;margin:15px auto"></div><div id="msg"></div>
<script>let nums=[];for(let i=1;i<=15;i++)nums.push(i);let grid=document.getElementById('grid');nums.forEach(function(n){let d=document.createElement('div');d.className='num';d.innerText=n;d.id='n'+n;d.onclick=function(){d.classList.toggle('sel')};grid.appendChild(d);});
function sortear(){let r=Math.floor(Math.random()*15)+1;document.getElementById('n').innerText=r;let el=document.getElementById('n'+r);if(el)el.classList.add('sel');document.getElementById('msg').innerText='Marca o '+r+' se o tiveres!';}</script></body></html>
