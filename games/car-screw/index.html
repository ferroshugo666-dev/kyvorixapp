<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Car Screw</title>
<style>body{font-family:sans-serif;background:#cfe8ff;text-align:center;padding:10px} .car{font-size:80px} .screw{display:inline-block;background:#fff;border-radius:50%;width:60px;height:60px;line-height:60px;font-size:30px;margin:5px;cursor:pointer}</style></head>
<body><h1>🚗 Car Screw</h1><p>Desaperta todos os parafusos!</p><div class="car">🚗</div><h2>Restam: <span id="n">6</span></h2><div id="box"></div><div id="msg"></div>
<script>let n=6;let box=document.getElementById('box');for(let i=0;i<6;i++){let d=document.createElement('div');d.className='screw';d.innerText='🔩';d.onclick=function(){d.style.visibility='hidden';n--;document.getElementById('n').innerText=n;if(n==0)document.getElementById('msg').innerHTML='<h2>🎉 Carro libertado!</h2><button onclick="location.reload()">Jogar outra vez</button>'};box.appendChild(d);}</script></body></html>
