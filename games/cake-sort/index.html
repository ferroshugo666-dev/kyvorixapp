<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cake Sort</title>
<style>body{font-family:sans-serif;background:#ffe0f0;text-align:center;padding:10px} .cake{display:inline-block;font-size:45px;margin:5px;cursor:pointer;background:#fff;border-radius:12px;padding:10px} button{padding:12px 20px;border:0;border-radius:10px;background:#ff4081;color:#fff;font-weight:bold}</style></head>
<body><h1>🍰 Cake Sort</h1><p>Clica nos bolos iguais para os juntar!</p><h2>Pontos: <span id="p">0</span></h2><div id="box"></div><div id="msg"></div>
<script>let p=0;let cakes=['🍰','🧁','🍩','🍰','🧁','🍩','🍰','🧁','🍩'];let last='';let box=document.getElementById('box');cakes.forEach(function(c){let d=document.createElement('div');d.className='cake';d.innerText=c;d.onclick=function(){if(last==c){p+=10;d.style.visibility='hidden';document.getElementById('msg').innerText='✅ Par! +10';}else{last=c;document.getElementById('msg').innerText='Clica noutro '+c;}document.getElementById('p').innerText=p;if(p>=30)document.getElementById('msg').innerText='🏆 Conseguiste!';};box.appendChild(d);});</script></body></html>
