<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quinta</title>
<style>body{font-family:sans-serif;background:#ffe9a8;text-align:center;padding:10px}.card{background:#fff;border-radius:14px;padding:15px;margin:10px auto;max-width:350px;cursor:pointer;font-size:22px}button{padding:12px 20px;border:0;border-radius:10px;background:#4caf50;color:#fff;font-weight:bold}</style></head>
<body><h1>🌾 Kyvorix Quinta</h1><h2>⭐ Nível <span id="lvl">1</span>/5</h2><p>Objetivo: <span id="goal">100</span> moedas</p><h3>🪙 <span id="coins">50</span></h3>
<div class="card" onclick="a(10)">🌱 Plantar +10</div><div class="card" onclick="a(20)">🌽 Colher +20</div><div class="card" onclick="a(15)">🐔 Galinha +15</div><div class="card" onclick="a(25)">🐄 Vaca +25</div>
<div id="log" style="background:#fff;padding:10px;border-radius:10px;max-width:350px;margin:auto">Bem-vindo!</div><br><button onclick="next()">⏭️ Próximo Nível</button>
<script>let lvl=1,c=50;let goals=[100,200,350,500,800];
function up(){document.getElementById('lvl').innerText=lvl;document.getElementById('coins').innerText=c;document.getElementById('goal').innerText=goals[lvl-1];}
function a(v){c+=v;document.getElementById('log').innerText='Ganhaste +'+v+'! Total: '+c;up();if(c>=goals[lvl-1])document.getElementById('log').innerText='🏆 Nível completo! Clica Próximo Nível';}
function next(){if(c>=goals[lvl-1]){if(lvl<5){lvl++;c=50;up();document.getElementById('log').innerText='➡️ Nível '+lvl+'! Meta: '+goals[lvl-1];}else{document.getElementById('log').innerText='👑 És o Rei da Quinta!';}}else{document.getElementById('log').innerText='❌ Falta '+(goals[lvl-1]-c)+' moedas';}}up();</script></body></html>
