<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Car Screw</title>
<style>body{font-family:sans-serif;background:#cfe8ff;text-align:center;padding:10px}.screw{display:inline-block;background:#fff;border-radius:50%;width:60px;height:60px;line-height:60px;font-size:30px;margin:5px;cursor:pointer}</style></head>
<body><h1>🚗 Car Screw</h1><h2>⭐ Nível <span id="lvl">1</span>/5</h2><h3>Restam: <span id="n">6</span></h3><div id="box"></div><div id="msg"></div><br><button onclick="next()">⏭️ Próximo Nível</button>
<script>let lvl=1,counts=[6,8,10,12,15],n=counts[0];function render(){document.getElementById('lvl').innerText=lvl;document.getElementById('n').innerText=n;let box=document.getElementById('box');box.innerHTML='';for(let i=0;i<n;i++){let d=document.createElement('div');d.className='screw';d.innerText='🔩';d.onclick=function(){d.style.visibility='hidden';n--;document.getElementById('n').innerText=n;if(n==0)document.getElementById('msg').innerHTML='🏆 Nível completo! Clica Próximo Nível';};box.appendChild(d);}}function next(){if(n==0){if(lvl<5){lvl++;n=counts[lvl-1];document.getElementById('msg').innerText='';render();}else{document.getElementById('msg').innerText='👑 Mestre dos Parafusos!';}}else{document.getElementById('msg').innerText='❌ Ainda faltam parafusos!';}}render();</script></body></html>
