<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahjong 3D - Kyvorix</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0a3d2a;color:#fff;font-family:system-ui;text-align:center}header{padding:8px}header a{color:#fff;text-decoration:none;font-weight:800}.row{display:flex;gap:4px;justify-content:center;padding:6px;flex-wrap:nowrap}.pile{width:calc((100vw - 40px)/8);max-width:72px;position:relative;min-height:95px;border:2px dashed rgba(255,255,255,.4);border-radius:8px;background:rgba(0,0,0,.15);flex-shrink:0}.pile.sel{outline:3px solid #ffb800}.card{width:100%;max-width:64px;height:88px;background:#fff;color:#111;border-radius:8px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:20px;font-weight:800;cursor:pointer}.card.red{color:#d00}.card.back{background:linear-gradient(135deg,#0b6cff,#7b2ff7);color:#fff;font-size:12px}.stack .card{position:absolute;left:3px;top:0}.stack{min-height:220px}.pile .card{position:absolute;left:3px;top:0}button{background:#ffb800;border:0;padding:10px 16px;border-radius:999px;font-weight:800;cursor:pointer;margin:4px}#msg{font-weight:700;min-height:20px}.savebar{background:rgba(0,0,0,.3);padding:8px;font-size:13px}#timer{font-weight:800;background:rgba(0,0,0,.3);display:inline-block;padding:4px 12px;border-radius:999px;margin:4px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:520px;margin:10px auto;padding:10px}.tile{background:#fff;color:#111;border-radius:8px;padding:16px 4px;font-size:24px;cursor:pointer}.tile.sel{outline:3px solid #ffb800;background:#ffe08a}.tile.gone{visibility:hidden}.tile.blocked{opacity:.55}</style></head><body>
<header><a href="/">⬅️ VOLTAR</a><h1>🀄 Mahjong 3D</h1></header><span id="timer" style="font-weight:800;background:rgba(0,0,0,.3);padding:4px 12px;border-radius:999px;margin:4px">⏱️ 00:00</span><div style="background:rgba(0,0,0,.3);padding:8px;font-size:13px">?? Gravao automtica | <button onclick="localStorage.removeItem('kyv_save_mahjong3d');location.reload()">🔄 Novo Jogo</button></div>
<div>XP: <span id="xp">0</span> | Restam: <span id="left">72</span></div><div class="grid" id="grid"></div><div id="msg"></div><button onclick="undo()">?? Desfazer</button><button onclick="shuffle()">?? Baralhar</button><button onclick="hint()">?? Dica</button>
<script>
const KEY='kyv_save_mahjong3d';
function beep(f){try{let a=new (window.AudioContext||window.webkitAudioContext)();let o=a.createOscillator();o.frequency.value=f||600;o.connect(a.destination);o.start();o.stop(a.currentTime+0.08)}catch(e){}}
function addXP(n){let x=parseInt(localStorage.getItem('kyv_xp')||'0')+n;localStorage.setItem('kyv_xp',x);document.getElementById('xp').textContent=x}
document.getElementById('xp').textContent=localStorage.getItem('kyv_xp')||'0';
let tiles,sel=null,hist=[];
function initFresh(){let emojis=['??','??','??','??','??','??','??','?','??','??','??','??','??','??','??','??','??','??'];tiles=[];emojis.forEach(e=>{tiles.push(e);tiles.push(e);tiles.push(e);tiles.push(e)});tiles.sort(()=>Math.random()-.5)}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&s.length==72){tiles=s;return true}}catch(e){}return false}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(tiles))}catch(e){}}
if(!load())initFresh();
function save(){hist.push(JSON.stringify(tiles));if(hist.length>50)hist.shift()}
function undo(){if(!hist.length)return;tiles=JSON.parse(hist.pop());sel=null;render()}
function hasPair(){let free=[];for(let i=0;i<tiles.length;i++)if(tiles[i]!='GONE'&&isFree(i))free.push(i);for(let a=0;a<free.length;a++)for(let b=a+1;b<free.length;b++)if(tiles[free[a]]==tiles[free[b]])return true;return false;}
function shuffle(){save();let rest=tiles.filter(t=>t!='GONE');rest.sort(()=>Math.random()-.5);let k=0;for(let i=0;i<tiles.length;i++)if(tiles[i]!='GONE')tiles[i]=rest[k++];sel=null;document.getElementById('msg').textContent='?? Baralhado!';beep(500);if(tiles.some(t=>t!="GONE") && !hasPair()){document.getElementById("msg").textContent="?? Sem jogadas! Carrega em Baralhar.";}render();}
function hint(){let free=[];for(let i=0;i<tiles.length;i++)if(tiles[i]!='GONE'&&isFree(i))free.push(i);for(let a=0;a<free.length;a++)for(let b=a+1;b<free.length;b++)if(tiles[free[a]]==tiles[free[b]]){sel=free[a];document.getElementById('msg').textContent='?? Procura o par de '+tiles[free[a]];if(tiles.some(t=>t!="GONE") && !hasPair()){document.getElementById("msg").textContent="?? Sem jogadas! Carrega em Baralhar.";}render();return;}document.getElementById('msg').textContent='?? Sem pares - carrega em Baralhar!';}function isFree(i){if(tiles[i]=='GONE')return false;let col=i%6;let leftGone=(col==0)||tiles[i-1]=='GONE';let rightGone=(col==5)||tiles[i+1]=='GONE';return leftGone||rightGone}
function render(){persist();document.getElementById('left').textContent=tiles.filter(t=>t!='GONE').length;let g=document.getElementById('grid');g.innerHTML='';tiles.forEach((t,i)=>{let d=document.createElement('div');d.className='tile'+(t=='GONE'?' gone':'')+(sel==i?' sel':'')+(t!='GONE'&&!isFree(i)?' blocked':'');d.textContent=t=='GONE'?'':t;d.onclick=()=>{if(t=='GONE'||!isFree(i))return;if(sel===null){sel=i;if(tiles.some(t=>t!="GONE") && !hasPair()){document.getElementById("msg").textContent="?? Sem jogadas! Carrega em Baralhar.";}render();return}if(sel==i){sel=null;if(tiles.some(t=>t!="GONE") && !hasPair()){document.getElementById("msg").textContent="?? Sem jogadas! Carrega em Baralhar.";}render();return}if(tiles[sel]==t){save();tiles[sel]='GONE';tiles[i]='GONE';sel=null;beep(700);addXP(10);if(tiles.every(x=>x=='GONE')){document.getElementById('msg').textContent='🏆 GANHASTE! +100 XP';addXP(100);localStorage.removeItem(KEY)}render()}else{sel=i;render()}};g.appendChild(d)})}
if(tiles.some(t=>t!="GONE") && !hasPair()){document.getElementById("msg").textContent="?? Sem jogadas! Carrega em Baralhar.";}render();
</script></body></html>
