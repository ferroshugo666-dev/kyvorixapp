<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bubble - Kyvorix</title>
<style>body{margin:0;background:#2a0a3d;color:#fff;font-family:system-ui;text-align:center}header{padding:8px}header a{color:#fff;text-decoration:none;font-weight:800}canvas{background:#111;border-radius:12px;max-width:95vw;touch-action:none}button{background:#ffb800;border:0;padding:10px 16px;border-radius:999px;font-weight:800;margin:6px;cursor:pointer}</style></head><body>
<header><a href="/">← VOLTAR</a><h1>🫧 Bubble</h1></header><div style="background:rgba(0,0,0,.3);padding:8px;font-size:13px">💾 Pontos gravados | <button onclick="localStorage.removeItem('kyv_save_bubble');location.reload()">🆕 Novo Jogo</button></div>
<canvas id="cv" width="360" height="480"></canvas><div>Pontos: <span id="pts">0</span> | XP: <span id="xp">0</span></div><div id="msg"></div>
<script>
const KEY='kyv_save_bubble';
function beep(f){try{let a=new (window.AudioContext||window.webkitAudioContext)();let o=a.createOscillator();o.frequency.value=f||600;o.connect(a.destination);o.start();o.stop(a.currentTime+0.08)}catch(e){}}
function addXP(n){let x=parseInt(localStorage.getItem('kyv_xp')||'0')+n;localStorage.setItem('kyv_xp',x);document.getElementById('xp').textContent=x}
document.getElementById('xp').textContent=localStorage.getItem('kyv_xp')||'0';
let cv=document.getElementById('cv'),ctx=cv.getContext('2d');let colors=['#ff2d55','#ffb800','#2ecc71','#0b6cff','#a55eea','#ff6b9d'];let R=16;let bubbles,angle=-Math.PI/2,cur,pts=0,shooting=false;
function initFresh(){bubbles=[];for(let r=0;r<5;r++)for(let c=0;c<10;c++){if(r%2==1&&c==9)continue;bubbles.push({x:20+c*32+(r%2?16:0),y:20+r*28,color:colors[Math.floor(Math.random()*colors.length)]})}cur=colors[0];pts=0}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&s.bubbles){bubbles=s.bubbles;cur=s.cur;pts=s.pts;return true}}catch(e){}return false}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({bubbles,cur,pts}))}catch(e){}}
if(!load())initFresh();
document.getElementById('pts').textContent=pts;
function draw(){ctx.clearRect(0,0,360,480);bubbles.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,R,0,7);ctx.fillStyle=b.color;ctx.fill();ctx.strokeStyle='#fff';ctx.stroke()});ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(180,460);ctx.lineTo(180+Math.cos(angle)*60,460+Math.sin(angle)*60);ctx.stroke();ctx.beginPath();ctx.arc(180,460,R,0,7);ctx.fillStyle=cur;ctx.fill()}
function shoot(){if(shooting)return;shooting=true;let b={x:180,y:460,color:cur};let dx=Math.cos(angle)*6,dy=Math.sin(angle)*6;let iv=setInterval(()=>{b.x+=dx;b.y+=dy;if(b.x<16||b.x>344)dx=-dx;if(b.y<16){place(b);clearInterval(iv);shooting=false;return}for(let o of bubbles){if(Math.hypot(b.x-o.x,b.y-o.y)<30){place(b);clearInterval(iv);shooting=false;return}}},16)}
function place(b){bubbles.push(b);let seen=new Set([b]);let q=[b];let group=[b];while(q.length){let c2=q.pop();bubbles.forEach(o=>{if(!seen.has(o)&&Math.hypot(c2.x-o.x,c2.y-o.y)<32&&o.color==c2.color){seen.add(o);q.push(o);group.push(o)}})}if(group.length>=3){bubbles=bubbles.filter(x=>!group.includes(x));pts+=group.length*10;addXP(group.length);beep(800);document.getElementById('pts').textContent=pts;if(!bubbles.length){document.getElementById('msg').textContent='🎉 GANHASTE! +100 XP';addXP(100);localStorage.removeItem(KEY)}}cur=colors[Math.floor(Math.random()*colors.length)];persist();draw()}
cv.addEventListener('pointermove',e=>{let r=cv.getBoundingClientRect();let x=e.clientX-r.left,y=e.clientY-r.top;angle=Math.atan2(y-460,x-180);if(angle>-0.2)angle=-0.2;if(angle<-Math.PI+0.2)angle=-Math.PI+0.2;draw()});cv.addEventListener('click',shoot);draw();
</script></body></html>
