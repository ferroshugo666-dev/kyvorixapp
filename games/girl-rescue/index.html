<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Girl Rescue</title>
<style>body{font-family:sans-serif;background:#fff3cd;text-align:center;padding:10px} .pin{display:block;background:#fff;border-radius:12px;padding:15px;margin:10px auto;max-width:320px;cursor:pointer;font-size:20px}</style></head>
<body><h1>👧 Girl Rescue</h1><p>Escolhe os pinos na ordem certa: 1 - Pedra, 2 - Água, 3 - Saída</p><div class="pin" onclick="escolha(1)">🪨 1 - Tirar a Pedra</div><div class="pin" onclick="escolha(2)">💧 2 - Abrir a Água</div><div class="pin" onclick="escolha(3)">🚪 3 - Abrir a Saída</div><div id="msg" style="background:#fff;padding:10px;border-radius:10px;max-width:320px;margin:auto">A rapariga está presa!</div>
<script>let step=1;function escolha(n){let m=document.getElementById('msg');if(n==step){step++;if(step==4)m.innerHTML='🎉 SALVASTE A RAPARIGA! <br><button onclick="location.reload()">Jogar outra vez</button>';else m.innerText='✅ Boa! Falta o passo '+step;}else{m.innerText='❌ Errado! Tenta de novo. Recomeça.';step=1;}}</script></body></html>
