<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Color</title>
<style>body{font-family:sans-serif;text-align:center;padding:10px} .pix{display:inline-block;width:40px;height:40px;border:1px solid #ccc;line-height:40px;cursor:pointer;font-weight:bold} .pal{padding:10px 15px;border-radius:10px;margin:5px;border:2px solid #000;cursor:pointer;display:inline-block}</style></head>
<body><h1>🎨 Happy Color</h1><p>Escolhe a cor e pinta o número igual</p><div><span class="pal" style="background:#ff5252" onclick="cor='red'">1 Vermelho</span><span class="pal" style="background:#69f0ae" onclick="cor='green'">2 Verde</span><span class="pal" style="background:#40c4ff" onclick="cor='blue'">3 Azul</span></div><br><div id="grid"></div><p id="msg"></p>
<script>let cor='red';let nums=[1,2,3,1,2,3,2,1,3,2,1,3,1,3,2,3];let g=document.getElementById('grid');nums.forEach(function(n){let d=document.createElement('div');d.className='pix';d.innerText=n;d.onclick=function(){let c=n==1?'red':n==2?'green':'blue';if(cor==c){d.style.background=c;d.style.color='#fff';d.innerText='✔';}else{document.getElementById('msg').innerText='❌ Cor errada! Esse é o número '+n;}};g.appendChild(d);});</script></body></html>
