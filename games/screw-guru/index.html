<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screw Guru</title>
<style>body{font-family:sans-serif;background:#e1d5ff;text-align:center;padding:10px}.screw{display:inline-block;background:#fff;border-radius:12px;width:70px;height:70px;line-height:70px;font-size:32px;margin:5px;cursor:pointer}</style></head>
<body><h1>🔩 Screw Guru</h1><h2>⭐ Nível <span id="lvl">1</span>/5 | Pontos: <span id="p">0</span></h2><p id="msg">Clica nos 🔴 vermelhos!</p><div id="box"></div><br><button onclick="next()">⏭️ Próximo Nível</button>
<script>let lvl=1,p=0,need=30;function render(){document.getElementById('lvl').innerText=lvl;let box=document.getElementById('box');box.innerHTML='';let cols=[];for(let i=0;i<4+lvl;i++)cols.push('🔴');for(let i=0;i<2+lvl;i++)cols.push('🔵');cols.sort(()=>Math.random()-0.5);cols.forEach(function(c){let d=document.createElement('div');d.className='screw';d.innerText=c+'🔩';d.onclick=function(){if(c=='🔴'){p+=10;d.style.visibility='hidden';document.getElementById('p').innerText=p;if(p>=need*(lvl))document.getElementById('msg').innerText='🏆 Nível completo!';}else{p=Math.max(0,p-5);document.getElementById('p').innerText=p;}};box.appendChild(d);});}function next(){if(p>=need*lvl){if(lvl<5){lvl++;render();document.getElementById('msg').innerText='➡️ Nível '+lvl;}else{document.getElementById('msg').innerText='👑 És Guru Máximo!';}}else{document.getElementById('msg').innerText='❌ Precisas '+(need*lvl)+' pontos';}}render();</script></body></html>
