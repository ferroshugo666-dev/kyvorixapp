<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Girl Rescue</title>
<style>body{font-family:sans-serif;background:#fff3cd;text-align:center;padding:10px}.pin{display:block;background:#fff;border-radius:12px;padding:15px;margin:10px auto;max-width:320px;cursor:pointer;font-size:20px}</style></head>
<body><h1>👧 Girl Rescue</h1><h2>⭐ Nível <span id="lvl">1</span>/5</h2><p id="hint">Ordem: Pedra, Água, Saída</p><div id="pins"></div><div id="msg" style="background:#fff;padding:10px;border-radius:10px;max-width:320px;margin:auto">A rapariga está presa!</div><br><button onclick="next()">⏭️ Próximo Nível</button>
<script>let lvl=1,step=1;let levels=[['🪨 Pedra','💧 Água','🚪 Saída'],['💧 Água','🪨 Pedra','🚪 Saída'],['🚪 Saída','🪨 Pedra','💧 Água'],['🪨 Pedra','🚪 Saída','💧 Água'],['💧 Água','🚪 Saída','🪨 Pedra']];
function render(){document.getElementById('lvl').innerText=lvl;document.getElementById('hint').innerText='Ordem secreta - descobre! Tenta 1,2,3';step=1;let pins=document.getElementById('pins');pins.innerHTML='';levels[lvl-1].forEach(function(t,i){let d=document.createElement('div');d.className='pin';d.innerText=(i+1)+' - '+t;d.onclick=function(){if(i+1==step){step++;if(step>3)document.getElementById('msg').innerText='🏆 Nível '+lvl+' completo! Clica Próximo Nível';else document.getElementById('msg').innerText='✅ Boa! Falta o passo '+step;}else{document.getElementById('msg').innerText='❌ Errado! Recomeça.';step=1;}};pins.appendChild(d);});}
function next(){if(step>3){if(lvl<5){lvl++;render();document.getElementById('msg').innerText='➡️ Nível '+lvl+'!';}else{document.getElementById('msg').innerText='👑 Salvadores Máximos!';}}else{document.getElementById('msg').innerText='❌ Completa o nível primeiro!';}}render();</script></body></html>
