<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DETETIVE DELA - 9 Niveis</title><style>body{margin:0;background:#141118;color:#f5f0e8;font-family:Georgia,serif}.top{padding:14px;background:#1e1c22;text-align:center}.wrap{max-width:780px;margin:0 auto;padding:14px}.card{background:#1e1c22;border:1px solid #333;padding:16px;border-radius:16px}.btn{background:#e8c07a;color:#111;border:0;padding:13px;border-radius:12px;font-weight:800;width:100%;font-size:16px;cursor:pointer;margin-top:8px}.btn2{background:#2b2833;color:#fff;border:1px solid #444;padding:11px;border-radius:10px;width:100%;cursor:pointer;margin-top:6px;text-align:left}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{padding:12px;background:#2b2833;border-radius:12px;text-align:center;cursor:pointer}.big{font-size:28px}.bar{height:8px;background:#333;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#e8c07a}</style></head><body><div class="top"><b>DETETIVE DELA</b> <span id="hud">NIVEL 1/9</span></div><div class="wrap"><div class="card" id="menu"><h1>9 Jogos dela. 9 Niveis Dificeis.</h1><p>Hay Day, Township, Car Screw, Screw Guru, Bingo, Happy Color, Cake Sort, Girl Rescue, UNO.<br><br>3 vidas. Tempo. Armadilhas.</p><button class="btn" onclick="start()">COMEÇAR NIVEL 1</button></div><div class="card hidden" id="game"><h2 id="gTitle"></h2><p id="gDesc"></p><div class="bar"><i id="gBar" style="width:100%"></i></div><div id="gArea" style="margin-top:12px"></div><div id="gMsg" style="margin-top:10px;color:#e8c07a;font-weight:700"></div></div><div class="card hidden" id="end"><h2 id="eTitle"></h2><p id="eText"></p><button class="btn" onclick="location.reload()">JOGAR OUTRA VEZ</button></div></div><script>
let lvl=0,lives=3,time=60,timer,seqIdx=0,pick=[];
const L=[
{t:"NIVEL 1 - HAY DAY",d:"MEMORIZA 8s depois escolhe as 6 certas.",type:"mem",items:["Cafe","Batom","Mala","Foto","Carta","Chave"],fakes:["Pizza","Comando","Meia","Carro"]},
{t:"NIVEL 2 - TOWNSHIP",d:"ORDENA a manha. 2 sao falsas.",type:"order",items:["Rita fez cafe","Recebeu carta","Discutiu","Pegou mala","Saiu e deixou chave"],fakes:["Foi ao ginasio","Foi ao cinema"]},
{t:"NIVEL 3 - CAR SCREW",d:"Tira na ordem Vermelho, Azul, Vermelho...",type:"screw",items:["VERMELHO","AZUL","VERMELHO","AZUL","VERMELHO","AZUL"]},
{t:"NIVEL 4 - SCREW GURU",d:"Memoriza 6s: 3-1-4-2-7-5-8-6 depois clica na ordem.",type:"seq",items:["3","1","4","2","7","5","8","6"]},
{t:"NIVEL 5 - BINGO",d:"Memoriza 8s: 14-27-09-32-41 depois clica na ordem.",type:"bingo",items:["14","27","09","32","41"],fakes:["15","28","08","33"]},
{t:"NIVEL 6 - HAPPY COLOR",d:"Memoriza 7s: 1=Rosa 2=Bege 3=Vermelho. Depois pinta.",type:"color",items:["Rosa","Bege","Vermelho"]},
{t:"NIVEL 7 - CAKE SORT",d:"Clica na pista, depois na caixa certa: RITA / FALSA / SUSPEITO.",type:"sort",items:["Cafe:RITA","Batom Rita:RITA","Mala:RITA","Foto:RITA","Batom falso:FALSA","Anel falso:FALSA","Bilhete:SUSPEITO","Sapato:SUSPEITO","Luva:SUSPEITO"]},
{t:"NIVEL 8 - GIRL RESCUE",d:"Qual porta salva a Rita? Pista: cor do batom = Vermelho, a do MEIO.",type:"rescue",items:["Porta Azul","Porta Vermelha Esq","Porta Vermelha Meio"]},
{t:"NIVEL 9 - UNO",d:"FINAL: Joga a prova certa para cada mentira.",type:"uno",items:["Foto","Batom","Carta"]}
];
function start(){document.getElementById("menu").classList.add("hidden");document.getElementById("game").classList.remove("hidden");show();}
function show(){let X=L[lvl];document.getElementById("gTitle").textContent=X.t;document.getElementById("gDesc").textContent=X.d;document.getElementById("gMsg").textContent="";clearInterval(timer);time=60;if(lvl==7)time=20;upd();timer=setInterval(()=>{time--;upd();if(time<=0){clearInterval(timer);fail("Acabou o tempo.");}},1000);let a=document.getElementById("gArea");a.innerHTML="";pick=[];seqIdx=0;
if(X.type=="mem"){a.innerHTML="<div class=big>"+X.items.join(" - ")+"</div><p>Memoriza 8s...</p>";setTimeout(()=>{a.innerHTML="<p>Escolhe as 6 certas:</p><div class=grid>"+sh([...X.items,...X.fakes]).map(v=>"<button class=btn2 onclick='pm(this,\""+v+"\")'>"+v+"</button>").join("")+"</div>";},8000);}
if(X.type=="order"){a.innerHTML=sh([...X.items,...X.fakes]).map(v=>"<button class=btn2 onclick='po(this,\""+v+"\")'>"+v+"</button>").join("");}
if(X.type=="screw"){a.innerHTML="<div class=grid>"+X.items.map((v,i)=>"<div class=box onclick='ps(this,"+i+")'><span class=big>"+v+"</span><br>Parafuso "+(i+1)+"</div>").join("")+"</div><p id=sm>Proximo: VERMELHO</p>";}
if(X.type=="seq"){a.innerHTML="<div class=big>3 - 1 - 4 - 2 - 7 - 5 - 8 - 6</div><p>Memoriza 6s!</p>";setTimeout(()=>{a.innerHTML=sh(X.items).map(v=>"<button class=btn2 onclick='pq(this,\""+v+"\")'>Parafuso "+v+"</button>").join("");},6000);}
if(X.type=="bingo"){a.innerHTML="<div class=big>14 - 27 - 09 - 32 - 41</div><p>Memoriza 8s!</p>";setTimeout(()=>{a.innerHTML=sh([...X.items,...X.fakes]).map(v=>"<button class=btn2 onclick='pq(this,\""+v+"\")'>"+v+"</button>").join("");},8000);}
if(X.type=="color"){a.innerHTML="<p><b>1=Rosa 2=Bege 3=Vermelho</b><br>Memoriza 7s!</p>";setTimeout(()=>{a.innerHTML="<button class=btn2 onclick='pc(this,\"Rosa\")'>Rosa</button><button class=btn2 onclick='pc(this,\"Bege\")'>Bege</button><button class=btn2 onclick='pc(this,\"Vermelho\")'>Vermelho</button>";},7000);}
if(X.type=="sort"){a.innerHTML="<div>"+X.items.map((v,i)=>"<button class=btn2 onclick='ss("+i+")'>"+v.split(":")[0]+"</button>").join("")+"</div><div style='display:flex;gap:6px'><button class=btn2 onclick='ds(\"RITA\")'>RITA</button><button class=btn2 onclick='ds(\"FALSA\")'>FALSA</button><button class=btn2 onclick='ds(\"SUSPEITO\")'>SUSPEITO</button></div><p id=sm2>Escolhe uma pista...</p>";window._s=null;window._d=0;}
if(X.type=="rescue"){a.innerHTML=X.items.map(v=>"<button class=btn2 onclick='pr(this,\""+v+"\")'>"+v+"</button>").join("");}
if(X.type=="uno"){a.innerHTML="<p>Suspeita: <b>Nao fui eu</b>. Qual prova?</p><button class=btn2 onclick='pu(this,\"Foto\")'>Foto</button><button class=btn2 onclick='pu(this,\"Batom\")'>Batom</button><button class=btn2 onclick='pu(this,\"Carta\")'>Carta</button>";}
}
function sh(a){return [...a].sort(()=>Math.random()-.5);}
function upd(){document.getElementById("hud").textContent="NIVEL "+(lvl+1)+"/9 - VIDAS "+lives+" - "+time+"s";document.getElementById("gBar").style.width=(time/60*100)+"%";}
function lose(m){lives--;upd();document.getElementById("gMsg").textContent="ERRADO: "+m;if(lives<=0)fail("Perdeste as 3 vidas.");}
function next(){clearInterval(timer);if(lvl>=8){win();}else{lvl++;show();}}
function pm(e,v){if(L[lvl].items.includes(v)){e.style.background="#2e5a2e";e.disabled=true;pick.push(v);if(pick.length==6)next();}else lose("Essa nao e da Rita!");}
function po(e,v){if(L[lvl].fakes.includes(v)){lose("Essa nem aconteceu!");return;}if(v===L[lvl].items[seqIdx]){e.style.background="#2e5a2e";e.disabled=true;seqIdx++;if(seqIdx==L[lvl].items.length)next();}else lose("Ordem errada!");}
function ps(e,i){if(i!==seqIdx){lose("Parafuso errado!");return;}e.style.opacity=.3;seqIdx++;document.getElementById("sm").textContent="Proximo: "+(seqIdx%2==0?"VERMELHO":"AZUL");if(seqIdx==6)next();}
function pq(e,v){if(v===L[lvl].items[seqIdx]){e.style.background="#2e5a2e";e.disabled=true;seqIdx++;if(seqIdx==L[lvl].items.length)next();}else lose("Sequencia errada!");}
function pc(e,v){if(v===L[lvl].items[seqIdx]){e.style.background="#2e5a2e";seqIdx++;if(seqIdx==3)next();}else lose("Cor errada!");}
function ss(i){window._s=i;document.getElementById("sm2").textContent="Escolheste: "+L[lvl].items[i].split(":")[0];}
function ds(b){if(window._s==null)return;let c=L[lvl].items[window._s].split(":")[1];if(b===c){window._d++;document.getElementById("sm2").textContent="CERTO "+window._d+"/9";if(window._d==9)next();}else lose("Caixa errada!");}
function pr(e,v){if(v.includes("Meio"))next();else lose("Porta errada!");}
function pu(e,v){let ex=["Foto","Batom","Carta"],li=["Nao fui eu","Nao estive la","Nao conheco a Rita"];if(v===ex[seqIdx]){seqIdx++;if(seqIdx==3)next();else document.getElementById("gArea").innerHTML="<p>Suspeita: <b>"+li[seqIdx]+"</b></p><button class=btn2 onclick='pu(this,\"Foto\")'>Foto</button><button class=btn2 onclick='pu(this,\"Batom\")'>Batom</button><button class=btn2 onclick='pu(this,\"Carta\")'>Carta</button>";}else lose("Prova errada!");}
function fail(m){clearInterval(timer);document.getElementById("game").classList.add("hidden");document.getElementById("end").classList.remove("hidden");document.getElementById("eTitle").textContent="FALHASTE";document.getElementById("eText").textContent=m;}
function win(){clearInterval(timer);document.getElementById("game").classList.add("hidden");document.getElementById("end").classList.remove("hidden");document.getElementById("eTitle").textContent="DETETIVE GENIO! Passaste os 9!";document.getElementById("eText").textContent="Passaste os 9 jogos dificeis. Vidas: "+lives+"/3";}
</script></body></html>
