<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Color</title>
<style>body{font-family:sans-serif;text-align:center;padding:10px}.pix{display:inline-block;width:40px;height:40px;border:1px solid #ccc;line-height:40px;cursor:pointer;font-weight:bold}.pal{padding:10px 15px;border-radius:10px;margin:5px;border:2px solid #000;cursor:pointer;display:inline-block}</style></head>
<body><h1>🎨 Happy Color</h1><h2>⭐ Nível <span id="lvl">1</span>/5 | Pintados: <span id="done">0</span>/<span id="total">16</span></h2><div><span class="pal" style="background:#ff5252" onclick="cor='red'">1 Vermelho</span><span class="pal" style="background:#69f0ae" onclick="cor='green'">2 Verde</span><span class="pal" style="background:#40c4ff" onclick="cor='blue'">3 Azul</span></div><br><div id="grid"></div><p id="msg"></p><button onclick="next()">⏭️ Próximo Nível</button>
<script>let lvl=1,cor='red',done=0,total=16;let patterns=[[1,2,3,1,2,3,2,1,3,2,1,3,1,3,2,3],[2,1,3,2,1,3,1,2,3,1,2,3,2,1,3,2],[3,3,1,2,1,2,3,1,2,3,1,2,3,1,2,3],[1,1,2,2,3,3,1,1,2,2,3,3,1,2,3,1],[3,2,1,3,2,1,3,2,1,3,2,1,3,2,1,3]];
function render(){done=0;document.getElementById('lvl').innerText=lvl;document.getElementById('done').innerText=0;document.getElementById('total').innerText=total;let g=document.getElementById('grid');g.innerHTML='';patterns[lvl-1].forEach(function(n){let d=document.createElement('div');d.className='pix';d.innerText=n;d.onclick=function(){let c=n==1?'red':n==2?'green':'blue';if(cor==c&&d.innerText!='✔'){d.style.background=c;d.style.color='#fff';d.innerText='✔';done++;document.getElementById('done').innerText=done;if(done>=total)document.getElementById('msg').innerText='🏆 Desenho completo!';}else if(cor!=c){document.getElementById('msg').innerText='❌ Cor errada!';}};g.appendChild(d);});}function next(){if(done>=total){if(lvl<5){lvl++;render();document.getElementById('msg').innerText='➡️ Nível '+lvl;}else{document.getElementById('msg').innerText='👑 Artista Máximo!';}}else{document.getElementById('msg').innerText='❌ Ainda falta pintar!';}}render();</script></body></html>
